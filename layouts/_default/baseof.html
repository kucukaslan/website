<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "tr" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main class="site-main page-enter">
    {{ block "main" . }}{{ end }}
  </main>
  {{ block "footer" . }}
    {{ partial "footer.html" . }}
  {{ end }}

  {{ if .Store.Get "hasMermaid" }}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'neutral' });
  </script>
  {{ end }}

  <script src="{{ "/js/theme-switcher.js" | absURL }}"></script>
  <script src="{{ "/js/nav.js" | absURL }}"></script>
  {{ partial "youtube-lazy-js.html" . }}
</body>
</html>
