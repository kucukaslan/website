<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__copy">
      <a href="{{ "/" | relURL }}">{{ with urls.Parse .Site.BaseURL }}{{ .Host }}{{ end }}</a>
      · {{ now.Format "2006" }}
    </p>
    {{- if .Site.Params.showrss -}}
    <a class="site-footer__rss" href="{{ "/index.xml" | relURL }}" title="Subscribe via RSS">
      <img src="{{ "/rss.svg" | relURL }}" alt="RSS" width="20" height="20">
    </a>
    {{- end -}}
  </div>
</footer>
