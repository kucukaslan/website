<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOGG Versiyon Karşılaştırma</title>
<meta name="description" content="TOGG modellerinin özelliklerinin karşılaştırılması">
<style>
:root{
  --bg:#f3f6f9;
  --surface:#fff;
  --surface-soft:#f8fafc;
  --surface-group:#27364a;
  --surface-cat:#eaf0f5;
  --border:#dce3ea;
  --border-strong:#c6d1dd;
  --text:#17212d;
  --muted:#667386;
  --accent:#0878c7;
  --accent-soft:#eaf5fd;
  --feature-w:365px;
  --product-w:245px;
  --shadow:0 8px 28px rgba(24,39,58,.07);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1900px;margin:0 auto;padding:24px}
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:16px}
h1{font-size:28px;line-height:1.15;margin:0 0 6px}
.sub{font-size:14px;color:var(--muted)}
.offline{
  border:1px solid #cce8d5;background:#eef9f2;color:#28653a;
  padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap
}
.toolbar{
  position:sticky;top:0;z-index:60;
  display:grid;grid-template-columns:auto minmax(280px,1fr) auto auto;gap:10px;
  padding:12px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px
}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;background:white}
.seg button{
  border:0;border-right:1px solid var(--border-strong);background:white;color:var(--muted);
  min-height:40px;padding:0 13px;font-size:13px
}
.seg button:last-child{border-right:0}
.seg button.active{background:var(--accent-soft);color:#075d9a;font-weight:800}
.search{
  width:100%;height:42px;border:1px solid var(--border-strong);border-radius:10px;
  padding:0 12px;outline:none
}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(8,120,199,.12)}
.outline{
  min-height:42px;border:1px solid var(--border-strong);background:white;border-radius:10px;
  padding:0 13px;color:#344256
}
.product-strip{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  border:1px solid var(--border);background:white;border-radius:13px;padding:10px 12px;margin-bottom:12px
}
.product-strip .label{font-size:12px;color:var(--muted);font-weight:800;margin-right:2px}
.product-toggle{
  border:1px solid var(--border-strong);background:white;border-radius:999px;padding:7px 11px;
  font-size:12px;color:#39475a;display:inline-flex;align-items:center;gap:7px
}
.product-toggle::before{content:"";width:8px;height:8px;border-radius:50%;background:#a9b3bf}
.product-toggle.on{border-color:#9fcbe9;background:#f0f8fe;color:#075d9a;font-weight:750}
.product-toggle.on::before{background:var(--accent)}
.product-toggle.off{opacity:.48}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 12px}
.stat{background:white;border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--muted)}
.stat strong{font-size:13px;color:var(--text)}
.legend{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px 1px;color:var(--muted);font-size:12px}
.legend-label{font-weight:800;color:#354153;margin-right:2px}
.status{
  display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;
  font-size:11px;font-weight:800;white-space:nowrap
}
.status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.s-S{background:#ebf7ef;color:#267044}
.s-P{background:#edf5ff;color:#27659c}
.s-O{background:#fff5e6;color:#8a5914}
.s-D{background:#f4efff;color:#6844a2}
.s-none{background:#f0f2f4;color:#76818e}
.shell{
  background:white;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
  overflow:auto;max-height:calc(100vh - 250px)
}
table{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content;font-size:13px}
th,td{border-bottom:1px solid var(--border);vertical-align:middle}
thead th{
  position:sticky;top:0;z-index:30;background:#f8fafc;padding:12px 13px;
  color:#445064;font-size:12px;box-shadow:0 1px 0 var(--border)
}
th.feature,td.feature{
  position:sticky;left:0;width:var(--feature-w);min-width:var(--feature-w);max-width:var(--feature-w);
  background:white;border-right:1px solid var(--border);z-index:20;text-align:left
}
thead th.feature{z-index:45;background:#f8fafc}
th.product,td.product{
  width:var(--product-w);min-width:var(--product-w);max-width:var(--product-w);text-align:center
}
th.product{font-weight:800;line-height:1.25}
.group-row td{
  background:var(--surface-group);color:white;border-bottom:0;padding:10px 13px;
  font-size:13px;font-weight:850;letter-spacing:.01em
}
.category-row td{background:var(--surface-cat);padding:0;border-bottom:1px solid #ced8e2}
.category-btn{
  width:100%;border:0;background:transparent;padding:10px 13px;
  display:flex;align-items:center;justify-content:space-between;text-align:left;
  color:#2b394b;font-weight:800
}
.category-meta{display:flex;align-items:center;gap:7px;color:#647286;font-size:11px;font-weight:700}
.pill{background:white;border:1px solid #cdd7e2;border-radius:999px;padding:3px 7px}
.pill.diff{background:#fff7e8;border-color:#efd9a8;color:#79561d}
tr.feature-row td{padding:9px 12px}
td.feature{font-weight:620;line-height:1.35}
tr.feature-row:hover td{background:#f8fbfd}
tr.feature-row:hover td.feature{background:#f8fbfd}
tr.has-diff td{background:#fffdf8}
tr.has-diff td.feature{background:#fffdf8}
tr.has-diff:hover td,tr.has-diff:hover td.feature{background:#fff9ea}
.plain-value{font-weight:650;line-height:1.35;white-space:pre-wrap}
.empty-value{color:#98a2ae}
.long-wrap{text-align:left}
.long-preview{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  line-height:1.35;white-space:pre-wrap;color:#344054
}
.long-wrap.open .long-preview{-webkit-line-clamp:unset}
.more{margin-top:5px;border:0;background:none;padding:0;color:#0870b8;font-size:11px;font-weight:750}
.empty{display:none;padding:48px;text-align:center;color:var(--muted)}
@media(max-width:1000px){
  .app{padding:12px}
  .hero{flex-direction:column}
  .toolbar{grid-template-columns:1fr;position:static}
  .seg button{height:40px;flex:1}
  .shell{max-height:none}
  :root{--feature-w:250px;--product-w:205px}
}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div>
      <h1 id="title">Togg versiyonlarını karşılaştır</h1>
      <div class="sub">Farkları öne çıkaran, tamamen çevrimdışı çalışan karşılaştırma görünümü.</div>
    </div>
  </div>

  <div class="toolbar">
    <div id="vehicleSwitch" class="seg">
      <button data-vehicle="T10F" class="active">T10F</button>
      <button data-vehicle="T10X">T10X</button>
    </div>

    <input id="search" class="search" type="search" placeholder="Özellik veya değer ara…">

    <div id="modeSwitch" class="seg">
      <button data-mode="diff" class="active">Sadece farklar</button>
      <button data-mode="all">Tümü</button>
    </div>

    <button id="collapseAll" class="outline">Kategorileri kapat</button>
  </div>

  <div id="productStrip" class="product-strip"></div>
  <div id="stats" class="stats"></div>

  <div class="legend">
    <span class="legend-label">Durumlar</span>
    <span class="status s-S"><span class="dot"></span>Standart</span>
    <span class="status s-P"><span class="dot"></span>Pakete dahil</span>
    <span class="status s-O"><span class="dot"></span>Opsiyonel</span>
    <span class="status s-D"><span class="dot"></span>Dijital opsiyon</span>
    <span class="status s-none"><span class="dot"></span>Yok</span>
  </div>

  <div class="shell">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty">Bu filtrelerle eşleşen özellik yok.</div>
  </div>
</div>

function data(){ return DATASETS[state.vehicle]; }
function products(){ return data().products; }
function ordered(arr){ return [...arr].sort((a,b)=>(a.display_order ?? 0)-(b.display_order ?? 0)); }
function visibleProducts(){ return products().filter(p=>state.selected.has(p.id)); }

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function rawValue(feature,productId){ return feature.values?.[productId] ?? ""; }
function normalized(v){ return String(v ?? "").trim().replace(/\s+/g," "); }

function differs(feature){
  const vals=visibleProducts().map(p=>normalized(rawValue(feature,p.id)));
  return vals.length>=2 && new Set(vals).size>1;
}

function statusCell(v){
  const key=String(v ?? "").trim();
  const s=STATUS[key];
  if(!s) return null;
  return `<span class="status ${s.cls}" title="${esc(key || "-")}"><span class="dot"></span>${esc(s.label)}</span>`;
}

  if(!key) return `<span class="empty-value">—</span>`;

  const isLong=key.length>110 || key.includes("\n");
  if(isLong){
    return `<div class="long-wrap" id="${id}">
      <div class="long-preview">${esc(key)}</div>
      <button class="more" data-expand="${id}">Detayı göster</button>
    </div>`;
  }
  return `<span class="plain-value">${esc(key)}</span>`;
}

function allRows(){
  const rows=[];
  for(const g of ordered(data().groups)){
    for(const c of ordered(g.categories)){
      for(const f of ordered(c.features)) rows.push({group:g,category:c,feature:f});
    }
  }
  return rows;
}

function resetVehicle(vehicle){
  state.vehicle=vehicle;
  state.selected=new Set(DATASETS[vehicle].products.map(p=>p.id));
  state.collapsed.clear();
  state.query="";
  document.getElementById("search").value="";
  document.querySelectorAll("#vehicleSwitch button").forEach(b=>b.classList.toggle("active",b.dataset.vehicle===vehicle));
  document.getElementById("title").textContent=`${vehicle} versiyonlarını karşılaştır`;
  render();
}

function renderProducts(){
  const el=document.getElementById("productStrip");
  el.innerHTML=`<span class="label">Karşılaştırılan versiyonlar</span>`+
    products().map(p=>`<button class="product-toggle ${state.selected.has(p.id)?"on":"off"}" data-product="${esc(p.id)}">${esc(p.title)}</button>`).join("");

  el.querySelectorAll("[data-product]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.product;
      if(state.selected.has(id)){
        if(state.selected.size<=2) return;
        state.selected.delete(id);
      }else{
        state.selected.add(id);
      }
      render();
    };
  });
}

function matchesQuery(feature){
  if(!state.query) return true;
  const q=state.query.toLocaleLowerCase("tr");
  const hay=[feature.name,...visibleProducts().map(p=>rawValue(feature,p.id))]
    .join(" ").toLocaleLowerCase("tr");
  return hay.includes(q);
}

function categoryFeatures(category){
  return ordered(category.features).filter(f=>{
    if(!matchesQuery(f)) return false;
    if(state.mode==="diff" && !differs(f)) return false;
    return true;
  });
}

function renderStats(){
  const queryRows=allRows().filter(r=>matchesQuery(r.feature));
  const diff=queryRows.filter(r=>differs(r.feature)).length;
  const cats=new Set(queryRows.map(r=>r.category.id)).size;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><strong>${visibleProducts().length}</strong> versiyon seçili</div>
    <div class="stat"><strong>${diff}</strong> farklı özellik</div>
    <div class="stat"><strong>${queryRows.length}</strong> toplam eşleşen özellik</div>
    <div class="stat"><strong>${cats}</strong> kategori</div>`;
}

function renderTable(){
  const vp=visibleProducts();
  document.getElementById("thead").innerHTML=`<tr>
    <th class="feature">Özellik</th>
    ${vp.map(p=>`<th class="product">${esc(p.title)}</th>`).join("")}
  </tr>`;

  let html="", matchedRowCount=0;

  for(const group of ordered(data().groups)){
    const catBlocks=[];

    for(const category of ordered(group.categories)){
      const shownFeatures=categoryFeatures(category);
      if(!shownFeatures.length) continue;

      const all=ordered(category.features);
      const diffCount=all.filter(differs).length;
      const closed=state.collapsed.has(category.id);

      let block=`<tr class="category-row"><td colspan="${vp.length+1}">
        <button class="category-btn" data-category="${esc(category.id)}">
          <span>${esc(category.name)}</span>
          <span class="category-meta">
            <span class="pill diff">${diffCount} fark</span>
            <span class="pill">${all.length} özellik</span>
            <span>${closed?"▾":"▴"}</span>
          </span>
        </button>
      </td></tr>`;

      if(!closed){
        for(const feature of shownFeatures){
          const diff=differs(feature);
          block+=`<tr class="feature-row ${diff?"has-diff":""}">
            <td class="feature">${esc(feature.name)}</td>
            ${vp.map((p,pi)=>`<td class="product">${renderValue(rawValue(feature,p.id),`v-${state.vehicle}-${feature.id}-${pi}`)}</td>`).join("")}
          </tr>`;
          matchedRowCount++;
        }
      }

      catBlocks.push(block);
    }

    if(catBlocks.length){
      html+=`<tr class="group-row"><td colspan="${vp.length+1}">${esc(group.title)}</td></tr>${catBlocks.join("")}`;
    }
  }

  document.getElementById("tbody").innerHTML=html;
  document.getElementById("empty").style.display=html?"none":"block";

  document.querySelectorAll("[data-category]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.category;
      state.collapsed.has(id)?state.collapsed.delete(id):state.collapsed.add(id);
      renderTable();
    };
  });

  document.querySelectorAll("[data-expand]").forEach(btn=>{
    btn.onclick=()=>{
      const wrap=document.getElementById(btn.dataset.expand);
      const open=wrap.classList.toggle("open");
      btn.textContent=open?"Kısalt":"Detayı göster";
    };
  });
}

function render(){
  renderProducts();
  renderStats();
  renderTable();
}

document.getElementById("vehicleSwitch").addEventListener("click",e=>{
  const b=e.target.closest("button[data-vehicle]");
  if(b && b.dataset.vehicle!==state.vehicle) resetVehicle(b.dataset.vehicle);
});

document.getElementById("modeSwitch").addEventListener("click",e=>{
  const b=e.target.closest("button[data-mode]");
  if(!b) return;
  state.mode=b.dataset.mode;
  document.querySelectorAll("#modeSwitch button").forEach(x=>x.classList.toggle("active",x===b));
  renderStats();
  renderTable();
});

document.getElementById("search").addEventListener("input",e=>{
  state.query=e.target.value;
  renderStats();
  renderTable();
});

document.getElementById("collapseAll").onclick=()=>{
  const cats=data().groups.flatMap(g=>g.categories);
  const allClosed=cats.every(c=>state.collapsed.has(c.id));

  if(allClosed){
    state.collapsed.clear();
    document.getElementById("collapseAll").textContent="Kategorileri kapat";
  }else{
    state.collapsed=new Set(cats.map(c=>c.id));
    document.getElementById("collapseAll").textContent="Kategorileri aç";
  }
  renderTable();
};

// Validate the real schema rather than guessing.
for(const [vehicle,d] of Object.entries(DATASETS)){
  if(!Array.isArray(d.products) || !Array.isArray(d.groups)){
    throw new Error(`${vehicle}: products[] / groups[] bulunamadı`);
  }
  for(const p of d.products){
    if(!p.id || !p.title) throw new Error(`${vehicle}: product id/title eksik`);
  }
  for(const g of d.groups){
    if(!Array.isArray(g.categories)) throw new Error(`${vehicle}: group.categories[] eksik`);
    for(const c of g.categories){
      if(!Array.isArray(c.features)) throw new Error(`${vehicle}: category.features[] eksik`);
      for(const f of c.features){
        if(!f.values || Array.isArray(f.values) || typeof f.values!=="object"){
          throw new Error(`${vehicle}: ${f.name ?? f.id} feature.values nesnesi eksik`);
        }
      }
    }
  }
}

resetVehicle("T10F");
</script>
</body>
</html>
