<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Coordinate Visualizer</title>
  <meta name="description" content="Extract coordinate pairs from logs, traces, or JSON text and display them together on an interactive map.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; display: flex; height: 100vh; background: #f4f4f9; }
    #sidebar { width: 380px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fff; border-right: 1px solid #ddd; }
    textarea { width: 100%; flex: 1; resize: none; font-family: monospace; font-size: 11px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #status { font-size: 13px; color: #4b5563; }
    #map { flex: 1; height: 100%; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2 style="margin:0; font-size: 18px;">Log Coordinate Map</h2>
    <textarea id="logInput" placeholder="Paste log, trace, or JSON string here..."></textarea>
    <button onclick="parseAndMap()">Extract & Display</button>
    <div id="status">Paste log data and click extract.</div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const layerGroup = L.layerGroup().addTo(map);

    function extractCoordinates(rawText) {
      // Normalize escaped characters, newlines, and non-breaking spaces
      const text = rawText
        .replace(/\\n/g, ' ')
        .replace(/\\"/g, '"')
        .replace(/\u00a0/g, ' ');

      // Regex matches array coordinate pairs [lon, lat]
      const regex = /\[\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\]/g;
      const points = [];
      let match;

      while ((match = regex.exec(text)) !== null) {
        const lon = parseFloat(match[1]);
        const lat = parseFloat(match[2]);

        // Filter valid geographical boundaries
        if (!isNaN(lon) && !isNaN(lat) && Math.abs(lon) <= 180 && Math.abs(lat) <= 90) {
          // Exclude simple index pairs (e.g., source/destination indices like [0, 1])
          if (Number.isInteger(lon) && Number.isInteger(lat) && Math.abs(lon) < 100) {
            continue; 
          }
          points.push({ lon, lat, leaflet: [lat, lon] });
        }
      }
      return points;
    }

    function parseAndMap() {
      const input = document.getElementById('logInput').value;
      const statusDiv = document.getElementById('status');
      const coords = extractCoordinates(input);

      layerGroup.clearLayers();

      if (coords.length === 0) {
        statusDiv.innerText = "No valid coordinate pairs detected.";
        return;
      }

      const leafletLatLngs = coords.map(c => c.leaflet);

      // Draw route path
      const polyline = L.polyline(leafletLatLngs, { color: '#2563eb', weight: 4, opacity: 0.8 }).addTo(layerGroup);

      // Mark points (Green = Start, Red = End, Blue = Intermediate)
      coords.forEach((c, idx) => {
        let color = '#3b82f6';
        if (idx === 0) color = '#22c55e';
        if (idx === coords.length - 1) color = '#ef4444';

        L.circleMarker(c.leaflet, {
          radius: 6,
          fillColor: color,
          color: '#ffffff',
          weight: 2,
          fillOpacity: 0.9
        })
        .bindPopup(`<b>Point ${idx + 1}</b><br>Lon: ${c.lon}<br>Lat: ${c.lat}`)
        .addTo(layerGroup);
      });

      map.fitBounds(polyline.getBounds(), { padding: [40, 40] });
      statusDiv.innerText = `Mapped ${coords.length} point(s).`;
    }
  </script>
</body>
</html>
