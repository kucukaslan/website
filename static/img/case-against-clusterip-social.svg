<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Persistent connections reaching only part of a Kubernetes pod fleet</title>
  <desc id="desc">Five colored connection paths leave a client, pass through a virtual Service, and reach only four of ten backend pod tiles. The unused pods are faded.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2C2C2C" flood-opacity="0.09" />
    </filter>
    <pattern id="grain" width="160" height="160" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="18" r="1" fill="#2C2C2C" opacity="0.035" />
      <circle cx="92" cy="52" r="1" fill="#2C2C2C" opacity="0.025" />
      <circle cx="131" cy="129" r="1" fill="#2C2C2C" opacity="0.03" />
      <circle cx="47" cy="116" r="1" fill="#2C2C2C" opacity="0.025" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#FAF7F2" />
  <rect width="1200" height="630" fill="url(#grain)" />

  <g filter="url(#shadow)">
    <rect x="60" y="191" width="210" height="248" rx="24" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="3" />
    <rect x="111" y="235" width="108" height="78" rx="14" fill="#F3EFE8" stroke="#2C2C2C" stroke-width="4" />
    <path d="M136 337 H194 M136 357 H194 M136 377 H194" stroke="#6B6560" stroke-width="8" stroke-linecap="round" />
    <circle cx="236" cy="239" r="7" fill="#2A7F6F" />
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="8" opacity="0.94">
    <path d="M270 238 C365 238 411 267 485 294" stroke="#3D6F9F" />
    <path d="M270 276 C365 276 414 286 485 305" stroke="#B86432" />
    <path d="M270 315 C365 315 417 315 485 315" stroke="#2A7F6F" />
    <path d="M270 354 C365 354 414 344 485 325" stroke="#735E98" />
    <path d="M270 392 C365 392 411 363 485 336" stroke="#377985" />
  </g>

  <g filter="url(#shadow)">
    <circle cx="560" cy="315" r="78" fill="#FFFFFF" stroke="#2A7F6F" stroke-width="5" />
    <circle cx="560" cy="315" r="38" fill="#F3EFE8" stroke="#2A7F6F" stroke-width="4" />
    <path d="M542 315 H578 M560 297 V333" stroke="#2A7F6F" stroke-width="7" stroke-linecap="round" />
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="8" opacity="0.94">
    <path d="M635 291 C723 248 747 110 851 110" stroke="#3D6F9F" />
    <path d="M635 300 C727 272 752 110 851 110" stroke="#B86432" />
    <path d="M638 315 C731 315 759 250 851 250" stroke="#2A7F6F" />
    <path d="M635 330 C727 358 752 390 851 390" stroke="#735E98" />
    <path d="M635 339 C723 382 747 530 851 530" stroke="#377985" />
  </g>

  <g fill="#FFFFFF" stroke-width="3" filter="url(#shadow)">
    <rect x="851" y="72" width="132" height="76" rx="14" stroke="#3D6F9F" />
    <rect x="1002" y="72" width="132" height="76" rx="14" stroke="#E0DAD0" opacity="0.42" />
    <rect x="851" y="178" width="132" height="76" rx="14" stroke="#E0DAD0" opacity="0.42" />
    <rect x="1002" y="178" width="132" height="76" rx="14" stroke="#2A7F6F" />
    <rect x="851" y="284" width="132" height="76" rx="14" stroke="#E0DAD0" opacity="0.42" />
    <rect x="1002" y="284" width="132" height="76" rx="14" stroke="#E0DAD0" opacity="0.42" />
    <rect x="851" y="390" width="132" height="76" rx="14" stroke="#735E98" />
    <rect x="1002" y="390" width="132" height="76" rx="14" stroke="#E0DAD0" opacity="0.42" />
    <rect x="851" y="496" width="132" height="76" rx="14" stroke="#377985" />
    <rect x="1002" y="496" width="132" height="76" rx="14" stroke="#E0DAD0" opacity="0.42" />
  </g>

  <g fill="#F3EFE8" stroke="#D8D0C4" stroke-width="3" opacity="0.6">
