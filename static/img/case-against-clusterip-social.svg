    <circle cx="443" cy="294" r="10" fill="#B86432" />
    <circle cx="681" cy="273" r="10" fill="#3D6F9F" />
    <circle cx="744" cy="360" r="10" fill="#735E98" />
    <circle cx="795" cy="471" r="10" fill="#377985" />
